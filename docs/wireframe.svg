<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850">
<rect width="1100" height="850" fill="#f2f6fb"/><text x="56" y="65" font-family="Arial" font-size="29" font-weight="bold" fill="#10223b">TerraWatch — React Component Wireframe</text>
<text x="56" y="96" font-family="Arial" font-size="15" fill="#52687e">Three API endpoints · One shared React state owner · Props flow downward / events upward</text>
<rect x="44" y="125" width="1012" height="660" rx="16" fill="white" stroke="#7694aa" stroke-width="2"/><text x="67" y="161" font-family="Arial" font-size="22" font-weight="bold" fill="#123554">&lt;App /&gt; — owns location, weather, earthquakes, filters, loading/errors</text>
<rect x="75" y="188" width="950" height="62" rx="9" fill="#dcecfb" stroke="#6086a5"/><text x="98" y="225" font-family="Arial" font-size="19" fill="#143957">&lt;Header /&gt;  Brand + navigation</text>
<rect x="75" y="270" width="950" height="130" rx="9" fill="#dbf6ef" stroke="#4aa991"/><text x="98" y="302" font-family="Arial" font-size="19" font-weight="bold" fill="#165a4e">&lt;Hero /&gt;</text><rect x="98" y="316" width="900" height="65" rx="7" fill="white" stroke="#59ad97"/><text x="120" y="342" font-family="Arial" font-size="17" fill="#165a4e">&lt;SearchPanel /&gt; — local query + results state</text><text x="120" y="368" font-family="Arial" font-size="14" fill="#376b63">props: onSelect(city) ↑ to App; submits search to Geocoding API</text>
<rect x="75" y="418" width="950" height="52" rx="9" fill="#eef0fc" stroke="#8f91c0"/><text x="98" y="451" font-family="Arial" font-size="18" fill="#353d81">&lt;LocationHeading /&gt; — selected city / coordinates</text>
<rect x="75" y="488" width="455" height="211" rx="10" fill="#f1f9fc" stroke="#6c9cbb"/><text x="95" y="520" font-family="Arial" font-size="19" font-weight="bold" fill="#173d62">&lt;WeatherPanel /&gt;</text><text x="95" y="548" font-family="Arial" font-size="14" fill="#4e6a80">props: weather, loading, error</text><rect x="95" y="563" width="414" height="48" rx="7" fill="white" stroke="#9cbad1"/><text x="113" y="592" font-family="Arial" font-size="16" fill="#235070">CurrentWeather + &lt;Metric /&gt; × 3</text><rect x="95" y="624" width="414" height="52" rx="7" fill="white" stroke="#9cbad1"/><text x="113" y="655" font-family="Arial" font-size="16" fill="#235070">&lt;ForecastDay /&gt; × 5</text>
<rect x="548" y="488" width="477" height="211" rx="10" fill="#fff8ea" stroke="#ba9960"/><text x="570" y="520" font-family="Arial" font-size="19" font-weight="bold" fill="#825d1f">&lt;EarthquakePanel /&gt;</text><text x="570" y="548" font-family="Arial" font-size="14" fill="#8a743f">props: events, loading, error, radius, days</text><rect x="570" y="563" width="431" height="48" rx="7" fill="white" stroke="#d3bd91"/><text x="588" y="592" font-family="Arial" font-size="15" fill="#785b29">Filters — onRadius/onDays ↑ to App</text><rect x="570" y="624" width="431" height="52" rx="7" fill="white" stroke="#d3bd91"/><text x="588" y="655" font-family="Arial" font-size="16" fill="#785b29">EventSummary + &lt;EventRow /&gt; × N</text>
<rect x="75" y="716" width="950" height="44" rx="8" fill="#edf0f4" stroke="#a7b0bc"/><text x="99" y="743" font-family="Arial" font-size="17" fill="#4a5f71">&lt;SafetyDisclaimer /&gt; + &lt;Footer /&gt;</text>
</svg>
